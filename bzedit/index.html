<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>壁纸裁剪器</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>壁纸裁剪器</h1>
            <p>上传、拖动裁剪框、保存常见分辨率壁纸</p>
          </div>
        </div>
        <div class="top-actions">
          <label class="btn btn-primary file-btn">
            上传壁纸
            <input id="fileInput" type="file" accept="image/*" />
          </label>
          <button id="downloadBtn" class="btn btn-accent" type="button" disabled>保存下载</button>
        </div>
      </header>

      <main class="workspace">
        <section class="stage-wrap">
          <div id="dropzone" class="dropzone">
            <canvas id="canvas"></canvas>
            <div id="emptyState" class="empty">
              <strong>点击上传或把图片拖到这里</strong>
              <span>支持 JPG / PNG / WEBP，可触屏拖动裁剪框</span>
            </div>
          </div>
        </section>

        <aside class="panel">
          <h2>目标分辨率</h2>
          <div id="presets" class="presets"></div>

          <form id="customForm" class="custom">
            <label>
              宽
              <input id="customW" type="number" min="1" max="16384" inputmode="numeric" placeholder="1920" />
            </label>
            <span class="times">×</span>
            <label>
              高
              <input id="customH" type="number" min="1" max="16384" inputmode="numeric" placeholder="1080" />
            </label>
            <button class="btn" type="submit">应用自定义</button>
          </form>

          <div class="meta">
            <div><span>原图</span><strong id="srcInfo">未上传</strong></div>
            <div><span>裁剪</span><strong id="cropInfo">—</strong></div>
            <div><span>输出</span><strong id="outInfo">1920 × 1080</strong></div>
          </div>

          <label class="check">
            <input id="jpegToggle" type="checkbox" />
            导出 JPEG（体积更小）
          </label>
        </aside>
      </main>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
